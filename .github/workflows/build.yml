name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

env:
  # Immutable dependency pins (see DEPENDENCIES.md / CI_DEPENDENCY_LOCK.md).
  GEODE_SDK_VERSION: "6.0.0"
  GEODE_BINDINGS_REF: "c46bcdfc511b992200bb3818f7c1de1f41dc8fde"
  # geode-sdk/build-geode-mod @ main (2026-11 audit), pinned by full commit SHA.
  BUILD_GEODE_MOD_REF: "dce36b35e1c3d9d8af92347760b12eba3caf4004"

jobs:
  verify-pins:
    name: Verify dependency pins
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify immutable revisions and FFmpeg hashes
        run: bash ci/verify-pins.sh

  build:
    name: ${{ matrix.config.name }}
    needs: ['verify-pins']
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: iOS
            os: macos-latest
            target: iOS

    runs-on: ${{ matrix.config.os }}

    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build the mod
        # geode-sdk/build-geode-mod @ main, pinned to a full commit SHA.
        uses: geode-sdk/build-geode-mod@dce36b35e1c3d9d8af92347760b12eba3caf4004
        with:
          sdk: ${{ env.GEODE_SDK_VERSION }}
          bindings: geode-sdk/bindings
          bindings-ref: ${{ env.GEODE_BINDINGS_REF }}
          combine: true
          target: ${{ matrix.config.target }}

      - name: Verify the SDK / bindings actually used
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ ! -d "$GEODE_SDK/.git" ] || [ ! -d "$GEODE_BINDINGS_REPO_PATH/.git" ]; then
            echo "::error::Expected git checkouts for GEODE_SDK and bindings"
            exit 1
          fi
          bash ci/verify-pins.sh

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      # geode-sdk/build-geode-mod/combine @ same pinned commit.
      - uses: geode-sdk/build-geode-mod/combine@dce36b35e1c3d9d8af92347760b12eba3caf4004
        id: build

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
