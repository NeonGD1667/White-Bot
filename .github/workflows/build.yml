
name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

env:
  GEODE_SDK_VERSION: "6.0.0"
  GEODE_BINDINGS_REF: "7a0840c7ccc5597bbde04c3d29618553aeef81d6"
  GEODE_CLI_VERSION: "v4.0.2"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: macOS
            os: macos-latest
            target: MacOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

          - name: iOS
            os: macos-latest
            target: iOS

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@dce36b35e1c3d9d8af92347760b12eba3caf4004
        with:
          sdk: ${{ env.GEODE_SDK_VERSION }}
          cli: ${{ env.GEODE_CLI_VERSION }}
          bindings: geode-sdk/bindings
          bindings-ref: ${{ env.GEODE_BINDINGS_REF }}
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package Builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine Geode Builds
        uses: geode-sdk/build-geode-mod/combine@dce36b35e1c3d9d8af92347760b12eba3caf4004
        id: build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: White-Bot-Geode-v6-2.2091
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error

